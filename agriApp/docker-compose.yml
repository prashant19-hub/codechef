services:
  postgres:
    image: postgres:16-alpine
    container_name: agriapp-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: golang123
      POSTGRES_DB: agriapp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./sample_data.sql:/docker-entrypoint-initdb.d/2-sample_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agriapp"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriapp-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGRI_DB_URL: postgres://postgres:postgres@postgres:5432/agriapp?sslmode=disable
      AGRI_TEMPLATE_PATH: /app/template/index.html
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data: